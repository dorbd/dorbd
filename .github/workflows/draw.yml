name: draw

on:
  schedule:
    - cron: "3 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The whole history is one commit: every run throws the old history
      # away and publishes the repo as a single fresh commit.
      - name: draw today's
        run: |
          rm -rf art
          python3 scripts/draw.py
      - name: replace history with one commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan today
          git add -A
          git commit -m "No. $(( ( $(date -u +%s) - $(date -u -d 2020-01-01 +%s) ) / 86400 + 1 ))"
          git push --force origin today:main
      # Same idea for Actions: keep only this run, delete every finished one.
      - name: delete old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?status=completed" \
            --jq '.workflow_runs[].id')
          for id in $ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" || true
          done
